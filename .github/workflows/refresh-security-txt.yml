name: Refresh security.txt

on:
  schedule:
    # Monthly. The refresh script only changes the file when it expires within
    # 90 days, so this normally runs as a no-op.
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-security-txt
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh security.txt expiry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the release app so the pull request triggers the required checks.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Refresh Expires
        run: npm run security:refresh

      - name: Open pull request if needed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "security.txt is still valid; nothing to do."
            exit 0
          fi

          branch="security-txt/refresh-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore: refresh security.txt expiry"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh security.txt expiry" \
            --body "Automated refresh of the \`Expires\` field in \`.well-known/security.txt\`."
